<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="77 78 1100 1100" role="img" aria-labelledby="title desc" color-interpolation-filters="sRGB">
<title id="title">Agent</title>
<desc id="desc">A glossy ivory porcelain companion with three connected domes on textured charcoal.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2=".8" y2="1">
    <stop stop-color="#424248"/><stop offset=".2" stop-color="#303034"/><stop offset=".75" stop-color="#27272a"/><stop offset="1" stop-color="#19191b"/>
  </linearGradient>
  <linearGradient id="edge" x2="0" y2="1">
    <stop stop-color="#77777c" stop-opacity=".65"/><stop offset=".16" stop-color="#444449" stop-opacity=".2"/><stop offset=".8" stop-color="#080809" stop-opacity=".3"/><stop offset="1" stop-color="#060607" stop-opacity=".8"/>
  </linearGradient>
  <radialGradient id="body" cx=".32" cy=".18" r=".86">
    <stop stop-color="#fffdf8"/><stop offset=".28" stop-color="#f8efe2"/><stop offset=".6" stop-color="#e6d4ba"/><stop offset=".85" stop-color="#c8b18e"/><stop offset="1" stop-color="#9e8664"/>
  </radialGradient>
  <radialGradient id="dome" cx=".5" cy=".46" r=".57" fx=".32" fy=".2">
    <stop stop-color="#fffaf4"/><stop offset=".3" stop-color="#f5eadd"/>
    <stop offset=".62" stop-color="#e6d6c1"/><stop offset=".83" stop-color="#c3ab8b"/>
    <stop offset=".96" stop-color="#b7a07f"/><stop offset="1" stop-color="#d6c0a0"/>
  </radialGradient>
  <radialGradient id="rim" cx=".4" cy=".32" r=".72">
    <stop offset=".76" stop-color="#fff8ed" stop-opacity="0"/><stop offset=".91" stop-color="#fff8ed" stop-opacity=".08"/><stop offset=".97" stop-color="#fff7e7" stop-opacity=".25"/><stop offset="1" stop-color="#b29b7a" stop-opacity=".25"/>
  </radialGradient>
  <linearGradient id="neck" x1="0" y1="0" x2="1" y2=".1">
    <stop stop-color="#fffaf0"/><stop offset=".2" stop-color="#ecdfcb"/><stop offset=".56" stop-color="#d1bda0"/><stop offset=".85" stop-color="#dfcdb3"/><stop offset="1" stop-color="#fff7e9"/>
  </linearGradient>
  <linearGradient id="arm" x1="0" y1="0" x2=".2" y2="1">
    <stop stop-color="#fffaf0"/><stop offset=".3" stop-color="#efe1cd"/><stop offset=".68" stop-color="#d9c4a5"/><stop offset="1" stop-color="#aa906c"/>
  </linearGradient>
  <linearGradient id="eye" x1="0" y1="0" x2=".65" y2="1">
    <stop stop-color="#060605"/><stop offset=".35" stop-color="#161514"/><stop offset="1" stop-color="#252426"/>
  </linearGradient>
  <linearGradient id="eye-rim" x1="0" y1="0" x2=".2" y2="1">
    <stop stop-color="#927956"/><stop offset=".35" stop-color="#cbb08a"/><stop offset=".8" stop-color="#fff6de"/><stop offset="1" stop-color="#fffdf4"/>
  </linearGradient>
  <linearGradient id="shine" x2=".3" y2="1">
    <stop stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#fffdf8" stop-opacity=".74"/>
  </linearGradient>
  <filter id="tile-shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="shadow" x="-.25" y="-.25" width="1.5" height="1.6"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="contact" x="-.25" y="-.25" width="1.5" height="1.6"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="join-softness"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="eye-softness"><feGaussianBlur stdDeviation="1.3"/></filter>
  <filter id="reflection-softness"><feGaussianBlur stdDeviation="1.5"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency=".12 .7" numOctaves="2" seed="14" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
    <feConvolveMatrix order="3" kernelMatrix="0 -1 0 0 0 0 0 1 0" divisor="1" bias=".5" preserveAlpha="true"/>
  </filter>
  <pattern id="directional-grain" width="2048" height="2048" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
    <rect width="2048" height="2048" fill="#808080" filter="url(#grain)"/>
  </pattern>
  <path id="tile-shape" d="M305 79H945C1095 79 1177 156 1177 307V948C1177 1100 1098 1177 946 1177H306C153 1177 77 1101 77 948V307C77 155 155 79 305 79Z"/>
  <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>
  <path id="sculpture" d="M625 157C564 157 514 207 514 268C514 313 537 341 562 366C587 391 589 437 573 465C556 496 515 510 485 537C437 580 416 634 414 694C412 739 390 771 359 786C328 801 308 794 281 788C220 774 161 816 156 878C150 943 194 994 251 996C299 999 341 968 356 923C371 881 391 856 420 849C451 841 476 855 505 871C579 912 679 910 751 872C785 852 807 838 836 849C870 861 882 894 895 930C911 972 947 998 991 997C1052 996 1096 950 1095 892C1094 828 1042 779 983 787C949 790 928 806 892 789C851 770 834 739 832 697C829 631 808 582 763 539C730 508 693 495 676 464C661 436 662 394 687 367C715 338 737 310 737 268C737 206 688 157 625 157Z"/>
  <clipPath id="porcelain-clip"><use href="#sculpture"/></clipPath>
  <g id="satellite">
    <circle r="108" fill="url(#dome)" filter="url(#join-softness)"/>
    <circle r="100" fill="none" stroke="url(#dome-reflection)" stroke-width="3.5" opacity=".62" filter="url(#eye-softness)"/>
    <path d="M-61-31C-60-55-42-73-16-76C-5-76 3-73 10-69C-7-56-20-42-29-28Z" fill="url(#shine)" filter="url(#reflection-softness)"/>
  </g>
<linearGradient id="porcelain-bevel" x1="0" y1="0" x2=".45" y2="1">
    <stop stop-color="#fffdf9"/><stop offset=".45" stop-color="#fff8ed"/>
    <stop offset=".7" stop-color="#efdbc0"/><stop offset="1" stop-color="#b49b78"/>
  </linearGradient>
  <linearGradient id="tile-bevel" x1="0" y1="0" x2=".35" y2="1">
    <stop stop-color="#d5d2db"/><stop offset=".2" stop-color="#707079"/>
    <stop offset=".65" stop-color="#101013"/><stop offset="1" stop-color="#000"/>
  </linearGradient>

<linearGradient id="dome-reflection" x1=".1" y1="0" x2=".8" y2="1">
    <stop stop-color="#fffdf9" stop-opacity=".95"/>
    <stop offset=".28" stop-color="#fffaf2" stop-opacity=".65"/>
    <stop offset=".48" stop-color="#fffaf2" stop-opacity="0"/>
    <stop offset=".8" stop-color="#fff3dd" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff1d5" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="neck-glint" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#fffdf9" stop-opacity=".9"/>
    <stop offset=".45" stop-color="#fffaf2" stop-opacity="0"/>
    <stop offset="1" stop-color="#fffaf2" stop-opacity=".2"/>
  </linearGradient>
<filter id="join-fade" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="15"/></filter>
  <mask id="right-join-reflection" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240">
    <rect x="-120" y="-120" width="240" height="240" fill="white"/>
    <ellipse cx="-87" cy="-42" rx="38" ry="66" fill="black" filter="url(#join-fade)"/>
  </mask>
  <g id="right-satellite">
    <circle r="108" fill="url(#dome)" filter="url(#join-softness)"/>
    <circle r="100" fill="none" mask="url(#right-join-reflection)" stroke="url(#dome-reflection)" stroke-width="3.5" opacity=".62" filter="url(#eye-softness)"/>
    <path d="M-61-31C-60-55-42-73-16-76C-5-76 3-73 10-69C-7-56-20-42-29-28Z" fill="url(#shine)" filter="url(#reflection-softness)"/>
  </g>
</defs>
<rect x="77" y="78" width="1100" height="1100" fill="url(#tile)"/>
<rect x="77" y="78" width="1100" height="1100" fill="url(#directional-grain)" opacity=".07" style="mix-blend-mode:soft-light"/>
<g>
