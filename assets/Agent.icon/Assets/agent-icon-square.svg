  <path d="M302 796C358 818 409 775 422 724L477 817C437 834 389 825 365 889L346 930Z" fill="url(#arm)" filter="url(#join-softness)"/>
  <path d="M948 796C889 818 840 775 827 724L774 817C818 829 860 832 886 889L907 930Z" fill="url(#arm)" filter="url(#join-softness)"/>

  <path d="M563 371C583 397 588 430 578 455C568 481 548 493 532 505C555 492 578 486 599 485C586 465 589 450 590 431C591 408 582 382 563 371Z" fill="#fffaf2" opacity=".8" filter="url(#soft)"/>
  <path d="M667 383C656 412 657 445 672 466C681 479 697 491 714 502C689 490 674 485 660 480C652 449 651 415 667 383Z" fill="#fff7eb" opacity=".38" filter="url(#soft)"/>
  <path d="M320 800C359 806 402 779 419 744C405 785 368 817 328 811Z" fill="#fffaf3" opacity=".86" filter="url(#soft)"/>
  <path d="M834 747C853 783 888 807 928 800L921 812C884 815 848 788 834 747Z" fill="#fffaf3" opacity=".75" filter="url(#soft)"/>
  <ellipse cx="625" cy="696" rx="207" ry="199" fill="url(#dome)" filter="url(#join-softness)"/>

  <path d="M463 619C477 567 523 523 574 512C522 534 485 575 472 619Z" fill="#fffaf5" opacity=".65" filter="url(#reflection-softness)"/>
  <path d="M490 552C529 518 574 505 616 507C651 508 680 516 705 530C657 514 614 511 578 520C545 527 515 538 490 552Z" fill="#fffaf3" opacity=".38" filter="url(#soft)"/>
  <path d="M520 609C526 571 555 541 587 534C608 529 628 534 647 541C619 561 598 586 581 613Z" fill="url(#shine)" filter="url(#reflection-softness)"/>
  <use href="#satellite" transform="translate(625 266) scale(1.035)"/>
  <use href="#satellite" transform="translate(260 889) scale(.985)"/>
  <use href="#right-satellite" transform="translate(990 889) scale(.985)"/>
<use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="42" opacity="0.035"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="32" opacity="0.045"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="24" opacity="0.06"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="17" opacity="0.09"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="11" opacity="0.12"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="6" opacity="0.2"/>
  <use href="#sculpture" fill="none" stroke="url(#porcelain-bevel)" stroke-width="2" opacity="0.25"/>
  <use href="#sculpture" fill="none" stroke="url(#neck-glint)" stroke-width="8" opacity=".4"/>
  <ellipse cx="530" cy="689" rx="30" ry="47" filter="url(#eye-softness)" fill="url(#eye-rim)"/>
  <ellipse cx="720" cy="689" rx="30" ry="47" filter="url(#eye-softness)" fill="url(#eye-rim)"/>
  <ellipse cx="530" cy="689" rx="26" ry="43" fill="url(#eye)"/>
  <ellipse cx="720" cy="689" rx="26" ry="43" fill="url(#eye)"/>
</g></g>
</svg>
