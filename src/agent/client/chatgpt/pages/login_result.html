<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}} · Agent</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f5f5f5; background: #141414; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
    .card { padding: 40px; border: 1px solid #363636; border-radius: 24px; background: #202020; box-shadow: 0 12px 48px #0003; }
    .mark { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: #193525; color: #73d896; font-size: 18px; }
    .failed .mark { background: #3b3020; color: #f0bf73; }
    .cancelled .mark, .pending .mark { background: #363636; color: #b5b5b5; }
    h1 { display: flex; align-items: center; gap: 12px; font-size: 28px; line-height: 1.15; letter-spacing: -.7px; font-weight: 200; margin: 0 0 16px; }
    p { font-size: 16px; line-height: 1.6; color: #b5b5b5; margin: 0; }
    .instruction { color: #f5f5f5; font-weight: 400; margin-bottom: 8px; }
    @media (max-width: 420px) { .card { padding: 28px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main>
    <section class="card {{state}}" aria-labelledby="result-title">
      <h1 id="result-title"><span class="mark" aria-hidden="true">{{symbol}}</span>{{title}}</h1>
      <p class="instruction">You may now close this browser tab</p>
      <p>{{message}}</p>
    </section>
  </main>
</body>
</html>
