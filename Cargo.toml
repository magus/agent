[package]
name = "agent"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "agent"
path = "src/agent/main.rs"

[dependencies]
gpui-kit = "=0.7.1"
objc2 = "0.6"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
