[package]
name = "agent"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "agent"
path = "src/agent/main.rs"

[lib]
name = "agent_client"
path = "src/agent/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
jsonwebtoken = "9.3"
libc = "0.2"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
security-framework = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5", features = ["json"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
